services:
  frontend:
    build:
      context: ./sus-app
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:4000}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./sus-app-backend
    env_file:
      - path: ./sus-app-backend/.env
        required: false
    environment:
      PORT: 4000
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      - redis
    volumes:
      - backend-uploads:/app/upload/images
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
    env_file:
      - path: ./ai-service/.env
        required: false
    environment:
      AI_SERVICE_PORT: 8000
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  redis-data:
  backend-uploads:
