name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backend:
    name: Express API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sus-app-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sus-app-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: find config controllers middleware models routes utlis validators -name "*.js" -print0 | xargs -0 -n1 node --check

  frontend:
    name: React App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sus-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sus-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          CI: false
          REACT_APP_API_URL: http://localhost:4000
        run: npm run build

  ai-service:
    name: FastAPI AI Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall app

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config

      - name: Build compose images
        run: docker compose build
